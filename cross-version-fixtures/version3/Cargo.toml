[package]
name = "cross-version-fixture-v3"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
servyi-states = { path = "../../" }
servyi-states-snapshot = { path = "../../snapshot" }

# Deliberately NOT a workspace member: each fixture is its own version's
# codebase, compiled independently.
[workspace]
