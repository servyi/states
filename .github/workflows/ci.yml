name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene:
    # Repo hygiene is part of the policy: build artifacts and binaries
    # must never be tracked. Failed once (2179 fixture target files);
    # this check makes it impossible to merge again.
    name: no build artifacts tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fail if target/ or ELF files are tracked
        run: |
          set -eu
          bad=$(git ls-files | grep -E '(^|/)target/' || true)
          if [ -n "$bad" ]; then
            echo "tracked build artifacts:"; echo "$bad"; exit 1
          fi
          elf=$(git ls-files -z | xargs -0 -r file | grep ':.*ELF' || true)
          if [ -n "$elf" ]; then
            echo "tracked ELF files:"; echo "$elf"; exit 1
          fi

  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # nightly: the crate gates #![feature(register_tool)] for the
      # servyi::unsound_constructor lint attribute.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace

  lint-policy:
    # Shared Servyi policy (servyi/lints): clippy under the shared
    # flag list, the unsafe_scope driver, rustdoc links — in this
    # job's environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: servyi/lints/.github/actions/lint-policy@main
