name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # nightly: the crate gates #![feature(register_tool)] for the
      # servyi::unsound_constructor lint attribute.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-21
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace

  lint-policy:
    # Shared Servyi policy (servyi/lints): clippy under the shared
    # flag list, the unsafe_scope driver, rustdoc links — in this
    # job's environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: servyi/lints/.github/actions/lint-policy@main
