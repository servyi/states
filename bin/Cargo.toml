[package]
name = "hsbin"
version = "0.1.0"
edition = "2021"

[dependencies]
hslib = { path = "../lib" }

[[bin]]
name = "hsbin-saveable"
path = "src/saveable.rs"

[[bin]]
name = "hsbin-saveable-direct"
path = "src/saveable_direct.rs"
required-features = ["never"]

[[bin]]
name = "hsbin-custombox"
path = "src/custombox.rs"

[features]
never = []
