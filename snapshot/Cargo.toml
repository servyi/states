[package]
name = "servyi-states-snapshot"
version = "0.1.0"
edition = "2021"
description = "serde-based snapshot save/restore on top of servyi-states checkpoints"
license = "MIT"

[dependencies]
servyi-states = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
