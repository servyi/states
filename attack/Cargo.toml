[package]
name = "attack"
version = "0.1.0"
edition = "2021"

[dependencies]
hslib = { path = "../lib" }

# The attacks broke the pre-for<'n> API (see fe2417e); after the
# for<'n> fix they no longer COMPILE — the escape closure is a
# lifetime error. The sources stay as the record; build them with
# `cargo build -p attack --features never` to see it refused.
[features]
never = []

[[bin]]
name = "attack-uaf"
path = "src/uaf.rs"
required-features = ["never"]

[[bin]]
name = "attack-hang"
path = "src/hang.rs"
required-features = ["never"]

[[bin]]
name = "attack-typeconfusion"
path = "src/typeconfusion.rs"
required-features = ["never"]

[[bin]]
name = "attack-selfrequest"
path = "src/selfrequest.rs"
required-features = ["never"]

[[bin]]
name = "attack-leaksplit"
path = "src/leaksplit.rs"
required-features = ["never"]

[[bin]]
name = "attack-stash"
path = "src/stash.rs"
required-features = ["never"]

[[bin]]
name = "attack-forgetguard"
path = "src/forgetguard.rs"
required-features = ["never"]

[[bin]]
name = "attack-crosstree"
path = "src/crosstree.rs"

[[bin]]
name = "attack-cellwrite"
path = "src/cellwrite.rs"

[[bin]]
name = "attack-multireader"
path = "src/multireader.rs"

[[bin]]
name = "attack-gatedead"
path = "src/gatedead.rs"
required-features = ["never"]

[[bin]]
name = "attack-nestedroot"
path = "src/nestedroot.rs"

[[bin]]
name = "attack-panicchild"
path = "src/panicchild.rs"

[[bin]]
name = "attack-forgetouter"
path = "src/forgetouter.rs"
required-features = ["never"]
