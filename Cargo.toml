[package]
name = "servyi-states"
version = "0.1.0"
edition = "2021"
description = "Hierarchical context IDs, phase trackers, and generic state machine infrastructure"
license = "MIT"

[dependencies]
dashmap = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
servyi-states-snapshot = { path = "snapshot" }
tempfile = "3"

[workspace]
members = ["snapshot"]
# cross-version-fixtures/* are intentionally NOT members: each fixture is
# its own [workspace] — an independently versioned codebase built by the
# cross-version tests.

[features]
# Serialize/Deserialize for the trackers, so checkpoint consumers
# snapshot/restore them through serde instead of ad-hoc accessors that
# would bypass the phase-transition discipline.
serde = ["dep:serde"]

[dependencies.serde]
version = "1"
features = ["derive"]
optional = true
