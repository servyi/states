[package]
name = "servyi-states"
version = "0.1.0"
edition = "2021"
description = "Hierarchical context IDs, phase trackers, and generic state machine infrastructure"
license = "MIT"

[dependencies]
dashmap = "6"
vstd = "=0.0.0-2026-09-20-0158"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[package.metadata.verus]
verify = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
